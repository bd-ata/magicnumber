<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>魔法數字派對 - 終極完整版</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');

        body {
            background-color: #E5D9DD; 
            margin: 0; display: flex; flex-direction: column; align-items: center;
            height: 100vh; font-family: 'Nunito', sans-serif; overflow: hidden; touch-action: none; 
        }

        /* 大廳與教學面板 */
        .settings-panel, .tutorial-card {
            background: #FFF; padding: 25px; border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); text-align: center;
            width: 90%; max-width: 500px; z-index: 2000;
            max-height: 85vh; overflow-y: auto; /* 避免手機螢幕太小裝不下 */
        }

        .settings-panel h1 { color: #5D535E; font-size: 32px; margin: 0 0 5px 0; }
        .settings-panel .subtitle { color: #E57373; font-size: 18px; font-weight: bold; margin-bottom: 20px; }

        .setting-group { margin-bottom: 15px; text-align: left; }
        .setting-group label { font-size: 16px; color: #42A5F5; font-weight: 900; display: block; margin-bottom: 8px; }
        .options { display: flex; gap: 8px; flex-wrap: wrap; }
        
        .opt-btn {
            background: #F4EAE6; color: #5D535E; border: 2px solid transparent;
            padding: 8px 14px; font-size: 15px; border-radius: 12px; font-weight: bold;
            cursor: pointer; transition: all 0.2s;
        }
        .opt-btn.active { background: #FF9800; color: #FFF; border-color: #E65100; transform: scale(1.05); box-shadow: 0 4px 10px rgba(255,152,0,0.3); }

        .btn-wrap { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }

        .btn {
            background: #FF9800; color: white; border: none; flex: 1;
            padding: 15px; font-size: 20px; border-radius: 25px; font-weight: bold;
            cursor: pointer; box-shadow: 0 6px 0 #E65100; transition: 0.1s;
        }
        .btn:active { transform: translateY(6px); box-shadow: 0 0 0 #E65100; }
        .btn-info { background: #42A5F5; box-shadow: 0 6px 0 #1565C0; }
        .btn-info:active { box-shadow: 0 0 0 #1565C0; }

        /* 教學樣式 */
        .tutorial-card h2 { color: #42A5F5; margin-top: 0; font-size: 28px; }
        .tutorial-card ul { padding-left: 20px; line-height: 1.6; font-size: 16px; text-align: left; color: #5D535E;}
        .tutorial-card li { margin-bottom: 12px; }
        .highlight { font-weight: bold; color: #D32F2F; background: rgba(211, 47, 47, 0.1); padding: 2px 4px; border-radius: 4px;}

        /* 遊戲區域 */
        #battle-arena {
            display: flex; flex-wrap: wrap; gap: 15px; width: 100%; flex: 1;
            justify-content: center; align-items: stretch; padding: 20px 10px; box-sizing: border-box;
        }

        .player-wrapper { 
            display: flex; flex-direction: column; align-items: center; 
            flex: 1; min-width: 280px; max-width: 500px; position: relative;
        }

        .player-title { font-size: 24px; font-weight: 900; margin-bottom: 5px; text-shadow: 2px 2px 0 #FFF; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .fever-badge { font-size: 12px; background: #E91E63; color: white; padding: 2px 8px; border-radius: 10px; display: none; animation: pulse 0.5s infinite; }
        
        .header { display: flex; justify-content: space-between; width: 100%; max-width: 340px; margin-bottom: 5px; font-size: 16px; font-weight: 900; }
        .score-board { color: #FF9800; }
        .speed-indicator { color: #E57373; }

        .current-sum-display {
            font-size: 18px; background: rgba(255, 255, 255, 0.8); padding: 5px 15px;
            border-radius: 20px; margin-bottom: 10px; font-weight: bold; transition: color 0.2s;
            text-align: center; width: 100%; max-width: 310px; height: 35px; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .game-container {
            position: relative; width: 100%; max-width: 340px; flex: 1; 
            background: rgba(255, 255, 255, 0.4); border: 4px solid #B8A9AB; 
            border-radius: 12px; overflow: hidden; box-shadow: inset 0 0 20px rgba(0,0,0,0.05);
            transition: all 0.3s;
        }

        /* Fever 狂熱特效 */
        .game-container.fever-active { animation: feverBorder 0.6s infinite alternate; }
        @keyframes feverBorder {
            from { border-color: #FF9800; box-shadow: inset 0 0 20px rgba(255, 152, 0, 0.4); background: rgba(255, 243, 224, 0.6); }
            to { border-color: #E91E63; box-shadow: inset 0 0 40px rgba(233, 30, 99, 0.6); background: rgba(252, 228, 236, 0.6); }
        }

        .danger-zone { position: absolute; bottom: 0; width: 100%; height: 15px; z-index: 100; transition: box-shadow 0.3s; }

        /* 六角形基礎設定 */
        .hexagon {
            position: absolute; width: 50px; height: 57px; background-color: #D3C4D1;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; color: #5D535E; font-weight: bold; cursor: pointer; user-select: none;
            transition: background-color 0.1s, transform 0.1s;
        }
        .hexagon:active { transform: scale(0.9); }
        .hexagon.selected { background-color: #FFF2B2 !important; transform: scale(1.15); color: #FF9800; z-index: 10; box-shadow: 0 0 10px #FFEB3B; }
        .hexagon.flash { background-color: #FFF !important; transform: scale(1.3); opacity: 0; transition: all 0.3s ease-out; }

        /* 特殊方塊：炸彈與冰塊 */
        .hexagon.bomb-block { background-color: #424242; font-size: 26px; }
        .hexagon.frozen {
            background-color: #B3E5FC !important; border: 2px solid #E1F5FE;
            color: #0277BD; pointer-events: none; opacity: 0.9;
        }
        .hexagon.frozen::after { content: '🧊'; position: absolute; font-size: 16px; top: -2px; right: -2px; }
        .hexagon.falling { z-index: 1; filter: brightness(0.8); }

        .particle {
            position: absolute; width: 10px; height: 10px; background-color: #FFEB3B;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            pointer-events: none; z-index: 1000; transition: transform 0.6s ease-out, opacity 0.6s ease-out;
        }

        .floating-text {
            position: absolute; font-size: 20px; font-weight: 900; z-index: 999; pointer-events: none;
            animation: floatUp 1s forwards; text-shadow: 2px 2px 0 #FFF, -2px -2px 0 #FFF, 2px -2px 0 #FFF, -2px 2px 0 #FFF;
        }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-40px) scale(1.5); } }

        .overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(229, 217, 221, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2000; }
        .hidden { display: none !important; }

        #game-over-screen { background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px); }
        .winner-text { 
            font-size: 50px; margin: 10px 0; text-align: center;
            background: linear-gradient(to right, #FF9800, #FFEB3B, #4CAF50, #00BCD4, #E91E63);
            -webkit-background-clip: text; color: transparent;
            animation: pulse 1s infinite alternate; text-shadow: 0 0 20px rgba(255,255,255,0.3);
        }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.1); } }
        
        /* 撒花特效 (Confetti) */
        .confetti { position: absolute; width: 10px; height: 20px; z-index: 3000; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(100vh) rotate(720deg); } }
    </style>
</head>
<body>

    <!-- 遊戲大廳設定 -->
    <div id="start-screen" class="overlay">
        <div class="settings-panel">
            <h1>魔法數字派對</h1>
            <div class="subtitle">💣 完整極致版 🧊</div>

            <div class="setting-group">
                <label>👥 玩家人數</label>
                <div class="options" id="opt-players">
                    <div class="opt-btn active" data-val="1">單人挑戰</div>
                    <div class="opt-btn" data-val="2">雙人 PK</div>
                </div>
            </div>

            <div class="setting-group">
                <label>🎮 遊戲模式</label>
                <div class="options" id="opt-mode">
                    <div class="opt-btn active" data-val="10">合 10</div>
                    <div class="opt-btn" data-val="20">合 20</div>
                    <div class="opt-btn" data-val="multi">乘法特訓 ✖️</div>
                </div>
            </div>

            <div class="setting-group">
                <label>🎵 背景音樂</label>
                <div class="options" id="opt-bgm">
                    <div class="opt-btn" data-val="relax">輕鬆</div>
                    <div class="opt-btn active" data-val="arcade">街機</div>
                    <div class="opt-btn" data-val="tense">刺激</div>
                </div>
            </div>

            <div class="btn-wrap">
                <button class="btn btn-info" onclick="showTutorial()">玩法說明 📖</button>
                <button class="btn" onclick="applySettingsAndStart()">直接開戰 ⚔️</button>
            </div>
        </div>
    </div>

    <!-- 規則說明面板 -->
    <div id="tutorial-screen" class="overlay hidden">
        <div class="tutorial-card">
            <h2>📜 新規則秘笈</h2>
            <ul>
                <li><span class="highlight">⛓️ 斷鏈墜落：</span>方塊必須連接天花板，如果切斷連結，底下的方塊會全部掉落消失並得分！</li>
                <li><span class="highlight">💣 爆破炸彈：</span>畫面會隨機掉落炸彈，直接點擊會炸毀周圍的方塊（可用來製造斷鏈）！</li>
                <li><span class="highlight">🔥 狂熱連擊：</span>3 秒內連續消除 3 次會進入 Fever 狂熱狀態。分數雙倍，對手受到的攻擊也雙倍！</li>
                <li><span class="highlight">🧊 冰凍干擾：</span>(對戰限定) 受到攻擊時方塊會結冰。冰塊無法點擊，必須在它旁邊消除其他方塊才能震碎解凍！</li>
            </ul>
            <button class="btn btn-info" style="width: 100%; margin-top: 15px;" onclick="hideTutorial()">我準備好了！</button>
        </div>
    </div>

    <div id="game-over-screen" class="overlay hidden">
        <h1 style="color: white; text-shadow: none;">GAME OVER</h1>
        <h2 id="winner-display" class="winner-text">1P 獲勝！</h2>
        <button class="btn" style="width:80%; max-width: 300px; margin-top: 20px;" onclick="location.reload()">回首頁重新設定</button>
    </div>

    <div id="battle-arena"></div>

    <script>
        const config = { players: 1, mode: '10', bgm: 'arcade' };

        document.querySelectorAll('.options').forEach(group => {
            group.addEventListener('click', (e) => {
                if (e.target.classList.contains('opt-btn')) {
                    group.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    let key = group.id.split('-')[1];
                    let val = e.target.dataset.val;
                    config[key] = (key === 'players') ? parseInt(val) : val;
                }
            });
        });

        const THEMES = [
            { id: 'p1', name: '1P (藍)', color: '#42A5F5', border: '#90CAF9', bg: 'rgba(144, 202, 249, 0.2)' },
            { id: 'p2', name: '2P (紅)', color: '#EF5350', border: '#EF9A9A', bg: 'rgba(239, 154, 154, 0.2)' }
        ];

        function showTutorial() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('tutorial-screen').classList.remove('hidden');
        }
        function hideTutorial() {
            document.getElementById('tutorial-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        }

        function applySettingsAndStart() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('tutorial-screen').classList.add('hidden');
            const arena = document.getElementById('battle-arena');
            arena.innerHTML = ''; 

            players = [];
            for (let i = 0; i < config.players; i++) {
                let p = new PlayerBoard(THEMES[i]);
                players.push(p);
                arena.appendChild(p.createDOM());
                setTimeout(() => p.reset(), 50); 
            }
            players.forEach(p => p.opponents = players.filter(other => other !== p));

            globalGameOver = false;
            initAudio();
            startBGM(config.bgm); // 啟動背景音樂
            cancelAnimationFrame(mainLoopId);
            setTimeout(() => { mainLoopId = requestAnimationFrame(gameLoop); }, 100);
        }

        // --- 音效引擎 (包含 BGM) ---
        let audioCtx; let bgmInterval;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }
        function playTone(freq, type, duration, vol) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }
        function playClickSound() { playTone(800, 'sine', 0.1, 0.05); }
        function playCancelSound() { playTone(300, 'triangle', 0.15, 0.05); }
        function playClearSound() { playTone(400, 'square', 0.1, 0.05); setTimeout(() => playTone(800, 'square', 0.2, 0.05), 100); }
        function playBreakSound() { playTone(150, 'sawtooth', 0.2, 0.08); } 
        function playBombSound() { playTone(100, 'square', 0.3, 0.2); setTimeout(() => playTone(50, 'sawtooth', 0.4, 0.2), 100); }
        function playFeverSound() { playTone(800, 'square', 0.1, 0.1); setTimeout(() => playTone(1000, 'square', 0.2, 0.1), 100); setTimeout(() => playTone(1200, 'square', 0.4, 0.1), 200); }
        function playGameOverSound() { playTone(300, 'sawtooth', 0.5, 0.1); setTimeout(() => playTone(200, 'sawtooth', 1.0, 0.1), 300); }

        function startBGM(style) {
            clearInterval(bgmInterval);
            let notes, type, speed, vol;
            if (style === 'relax') {
                notes = [261, 329, 392, 523, 392, 329]; type = 'triangle'; speed = 400; vol = 0.03;
            } else if (style === 'arcade') {
                notes = [196, 0, 196, 233, 196, 0, 261, 233]; type = 'square'; speed = 180; vol = 0.02;
            } else { 
                notes = [100, 105, 110, 115, 120, 115, 110, 105]; type = 'sawtooth'; speed = 120; vol = 0.04;
            }
            let i = 0;
            bgmInterval = setInterval(() => {
                let freq = notes[i % notes.length];
                if (freq > 0) playTone(freq, type, 0.1, vol); 
                i++;
            }, speed); 
        }
        function stopBGM() { clearInterval(bgmInterval); }

        const HEX_WIDTH = 50; const HEX_HEIGHT = 57; const ROW_HEIGHT = 42; 
        let globalGameOver = false; let mainLoopId; let players = [];

        class PlayerBoard {
            constructor(theme) { this.theme = theme; this.opponents = []; }

            createDOM() {
                const wrapper = document.createElement('div');
                wrapper.className = 'player-wrapper';
                wrapper.innerHTML = `
                    <div class="player-title" style="color: ${this.theme.color};">
                        ${this.theme.name} <span class="fever-badge" id="${this.theme.id}-fever">🔥 FEVER</span>
                    </div>
                    <div class="header">
                        <div>⭐ <span id="${this.theme.id}-score">0</span></div>
                        <div id="${this.theme.id}-speed">🚀 Lv.1</div>
                    </div>
                    <div class="current-sum-display" id="${this.theme.id}-sum-box"></div>
                    <div class="game-container" id="${this.theme.id}-container" style="border-color: ${this.theme.border}; background: ${this.theme.bg};">
                        <div class="danger-zone" style="background: repeating-linear-gradient(45deg, ${this.theme.color}, ${this.theme.color} 10px, #333 10px, #333 20px);"></div>
                    </div>
                `;
                return wrapper;
            }

            reset() {
                this.container = document.getElementById(`${this.theme.id}-container`);
                this.scoreDisplay = document.getElementById(`${this.theme.id}-score`);
                this.speedDisplay = document.getElementById(`${this.theme.id}-speed`);
                this.sumBox = document.getElementById(`${this.theme.id}-sum-box`);
                this.feverBadge = document.getElementById(`${this.theme.id}-fever`);
                
                this.container.querySelectorAll('.hexagon, .particle, .floating-text').forEach(el => el.remove());
                this.activeHexes = []; this.selectedObjs = [];
                this.currentSum = 0; this.score = 0; this.rowIndex = 0; this.topMostY = 0;
                this.currentTarget = 0; 
                
                this.comboCount = 0; this.lastClearTime = 0; this.isFever = false;
                clearTimeout(this.feverTimeout);
                this.container.classList.remove('fever-active');
                this.feverBadge.style.display = 'none';

                this.speed = 0.05; this.baseSpeed = 0.05;
                this.scoreDisplay.innerText = 0;
                
                let startHeight = this.container.clientHeight * 0.45;
                for(let y = startHeight; y >= -ROW_HEIGHT; y -= ROW_HEIGHT) this.generateRow(y);

                if (config.mode === 'multi') this.generateNewTarget();
                else this.updateSumDisplay();
            }

            generateRow(y) {
                let count = this.rowIndex % 2 === 0 ? 6 : 5;
                let offsetX = this.rowIndex % 2 === 0 ? 10 : 35;

                for (let c = 0; c < count; c++) {
                    let hex = document.createElement('div');
                    hex.classList.add('hexagon');
                    
                    let isBomb = Math.random() < 0.05;
                    let val = 0;
                    if (isBomb) {
                        hex.innerText = '💣'; hex.classList.add('bomb-block');
                    } else {
                        val = Math.floor(Math.random() * 9) + 1; hex.innerText = val;
                    }

                    let obj = { el: hex, val: val, isBomb: isBomb, isFrozen: false, x: c * HEX_WIDTH + offsetX, y: y, falling: false, vy: 0 };
                    hex.style.left = obj.x + 'px'; hex.style.top = obj.y + 'px';
                    hex.addEventListener('pointerdown', (e) => { e.preventDefault(); this.handleHexClick(obj); });
                    
                    this.container.appendChild(hex);
                    this.activeHexes.push(obj);
                }
                this.rowIndex++; this.topMostY = y;
            }

            generateNewTarget() {
                let validHexes = this.activeHexes.filter(h => !h.falling && !h.isFrozen && !h.isBomb);
                if (validHexes.length >= 2) {
                    let idx1 = Math.floor(Math.random() * validHexes.length);
                    let idx2 = Math.floor(Math.random() * validHexes.length);
                    while(idx1 === idx2 && validHexes.length > 1) idx2 = Math.floor(Math.random() * validHexes.length);
                    this.currentTarget = validHexes[idx1].val * validHexes[idx2].val;
                } else {
                    this.currentTarget = (Math.floor(Math.random() * 9) + 1) * (Math.floor(Math.random() * 9) + 1);
                }
                this.updateSumDisplay();
            }

            handleHexClick(obj) {
                if (globalGameOver || obj.falling || obj.isFrozen) return;

                if (obj.isBomb) { this.explodeBomb(obj); return; }
                
                let index = this.selectedObjs.indexOf(obj);
                if (index > -1) {
                    obj.el.classList.remove('selected');
                    this.selectedObjs.splice(index, 1);
                    if (config.mode !== 'multi') this.currentSum -= obj.val;
                    playCancelSound(); this.updateSumDisplay(); return;
                }

                if (config.mode === 'multi' && this.selectedObjs.length >= 2) return;

                obj.el.classList.add('selected');
                this.selectedObjs.push(obj);
                if (config.mode !== 'multi') this.currentSum += obj.val;
                playClickSound(); this.updateSumDisplay();

                if (config.mode === 'multi') {
                    if (this.selectedObjs.length === 2) {
                        if (this.selectedObjs[0].val * this.selectedObjs[1].val === this.currentTarget) {
                            let toClear = [...this.selectedObjs]; this.selectedObjs = [];
                            this.processClear(toClear); this.generateNewTarget();
                        } else { this.cancelSelectionWithError(); }
                    }
                } else {
                    let target = parseInt(config.mode);
                    if (this.currentSum === target) {
                        let toClear = [...this.selectedObjs]; this.selectedObjs = []; this.currentSum = 0;
                        this.updateSumDisplay(); this.processClear(toClear);
                    } else if (this.currentSum > target) {
                        this.currentSum = 0; this.cancelSelectionWithError();
                    }
                }
            }

            explodeBomb(bombObj) {
                playBombSound();
                let toClear = [];
                for (let h of this.activeHexes) {
                    if (h.falling) continue;
                    let dx = h.x - bombObj.x; let dy = h.y - bombObj.y;
                    if (dx*dx + dy*dy < 4500) toClear.push(h);
                }
                
                toClear.forEach(h => {
                    let sIdx = this.selectedObjs.indexOf(h);
                    if(sIdx > -1) this.selectedObjs.splice(sIdx, 1);
                });
                
                if (config.mode !== 'multi') this.currentSum = this.selectedObjs.reduce((sum, o) => sum + o.val, 0);
                this.updateSumDisplay();
                this.processClear(toClear);
                if (config.mode === 'multi') this.generateNewTarget();
            }

            cancelSelectionWithError() {
                let toReset = [...this.selectedObjs];
                this.selectedObjs = []; this.updateSumDisplay(); playCancelSound();
                toReset.forEach(o => {
                    o.el.style.backgroundColor = '#E57373'; o.el.style.color = '#FFF';
                    setTimeout(() => {
                        if (!this.selectedObjs.includes(o)) {
                            o.el.style.backgroundColor = ''; o.el.style.color = ''; o.el.classList.remove('selected');
                        }
                    }, 300);
                });
            }

            updateSumDisplay() {
                if (config.mode === 'multi') {
                    if (this.selectedObjs.length === 1) this.sumBox.innerHTML = `🎯 找相乘 = <span style="color:#D32F2F">${this.currentTarget}</span> ( ${this.selectedObjs[0].val} × ? )`;
                    else this.sumBox.innerHTML = `🎯 找相乘 = <span style="color:#D32F2F">${this.currentTarget}</span>`;
                    this.sumBox.style.color = '#5D535E';
                } else {
                    let target = parseInt(config.mode);
                    this.sumBox.innerHTML = `加總：<span>${this.currentSum}</span> / ${target}`;
                    if (this.currentSum === target) this.sumBox.style.color = '#FF9800';
                    else if (this.currentSum > target) this.sumBox.style.color = '#E57373';
                    else this.sumBox.style.color = '#5D535E';
                }
            }

            processClear(hexesToClear) {
                if (hexesToClear.length === 0) return;
                playClearSound();

                let now = Date.now();
                if (now - this.lastClearTime < 3000) this.comboCount++;
                else this.comboCount = 1;
                this.lastClearTime = now;

                if (this.comboCount >= 3) {
                    if (!this.isFever) {
                        this.isFever = true; this.container.classList.add('fever-active');
                        this.feverBadge.style.display = 'inline-block'; playFeverSound();
                    }
                    clearTimeout(this.feverTimeout);
                    this.feverTimeout = setTimeout(() => {
                        this.isFever = false; this.comboCount = 0;
                        this.container.classList.remove('fever-active'); this.feverBadge.style.display = 'none';
                    }, 6000);
                }

                let multiplier = this.isFever ? 2 : 1;
                let scoreGain = (hexesToClear.length * 10) * multiplier;
                this.score += scoreGain; this.scoreDisplay.innerText = this.score;
                
                let clearedPoints = hexesToClear.map(h => ({x: h.x, y: h.y}));
                this.activeHexes.forEach(h => {
                    if (h.isFrozen) {
                        for(let p of clearedPoints) {
                            let dx = h.x - p.x; let dy = h.y - p.y;
                            if (dx*dx + dy*dy < 4500) {
                                h.isFrozen = false; h.el.classList.remove('frozen');
                                this.spawnFloatingText(h.x, h.y, "解凍!", "#42A5F5"); playBreakSound(); break;
                            }
                        }
                    }
                });

                hexesToClear.forEach(obj => {
                    let index = this.activeHexes.indexOf(obj);
                    if (index > -1) this.activeHexes.splice(index, 1); 
                    this.spawnParticles(obj.x + 25, obj.y + 28); 
                    obj.el.classList.add('flash');
                    setTimeout(() => obj.el.remove(), 300);
                });
                
                let lastObj = hexesToClear[hexesToClear.length - 1];
                let isAttack = (config.mode === 'multi') || (hexesToClear.length >= 3);

                if (config.players > 1 && isAttack) {
                    let attackPower = (config.mode === 'multi') ? 0.03 : 0.05;
                    let actualPower = attackPower * multiplier; 
                    let freezeAmount = this.isFever ? 4 : 2;
                    this.spawnFloatingText(lastObj.x, lastObj.y, this.isFever ? `狂熱攻擊!` : `攻擊!`, '#D32F2F');
                    this.opponents.forEach(opp => opp.receiveAttack(actualPower, freezeAmount));
                } else {
                    let textMsg = this.isFever ? `COMBO +${scoreGain}` : `+${scoreGain}`;
                    this.spawnFloatingText(lastObj.x, lastObj.y, textMsg, '#FF9800');
                }

                this.checkConnectivity();
            }

            receiveAttack(power, freezeAmount) {
                this.speed += power; 
                this.container.style.boxShadow = "inset 0 0 40px rgba(229, 115, 115, 0.9)";
                setTimeout(() => { this.container.style.boxShadow = "inset 0 0 20px rgba(0,0,0,0.05)"; }, 400);

                let unfrozen = this.activeHexes.filter(h => !h.isFrozen && !h.falling && !h.isBomb);
                unfrozen.sort((a, b) => b.y - a.y); 
                
                for(let i = 0; i < freezeAmount; i++) {
                    if (unfrozen.length > i) {
                        let target = unfrozen[i];
                        target.isFrozen = true; target.el.classList.add('frozen'); target.el.classList.remove('selected');
                        let sIdx = this.selectedObjs.indexOf(target);
                        if(sIdx > -1) this.selectedObjs.splice(sIdx, 1);
                    }
                }
                if (config.mode !== 'multi') this.currentSum = this.selectedObjs.reduce((sum, o) => sum + o.val, 0);
                this.updateSumDisplay();
            }

            checkConnectivity() {
                let roots = this.activeHexes.filter(h => !h.falling && h.y <= this.topMostY + ROW_HEIGHT + 10);
                let visited = new Set(roots); let queue = [...roots];

                while(queue.length > 0) {
                    let curr = queue.shift();
                    for (let other of this.activeHexes) {
                        if (!visited.has(other) && !other.falling) {
                            let dx = curr.x - other.x; let dy = curr.y - other.y;
                            if (dx*dx + dy*dy < 3600) { visited.add(other); queue.push(other); }
                        }
                    }
                }

                let droppedCount = 0;
                for (let h of this.activeHexes) {
                    if (!h.falling && !visited.has(h)) {
                        h.falling = true; h.el.classList.add('falling'); h.el.classList.remove('selected');
                        h.isFrozen = false; h.el.classList.remove('frozen');
                        let idx = this.selectedObjs.indexOf(h);
                        if(idx > -1) this.selectedObjs.splice(idx, 1);
                        droppedCount++;
                    }
                }
                
                if(droppedCount > 0) {
                    playBreakSound();
                    if(config.mode !== 'multi') this.currentSum = this.selectedObjs.reduce((sum, o) => sum + o.val, 0);
                    this.updateSumDisplay();
                }
            }

            update() {
                if (globalGameOver) return;
                this.speed += 0.00003; 
                
                let level = Math.floor((this.speed - this.baseSpeed) / 0.05) + 1;
                this.speedDisplay.innerText = `🚀 Lv.${level}`;
                let containerHeight = this.container.clientHeight;
                let dangerLimit = containerHeight - 15;
                
                for (let i = this.activeHexes.length - 1; i >= 0; i--) {
                    let obj = this.activeHexes[i];
                    if (obj.falling) {
                        obj.vy += 0.5; obj.y += obj.vy; obj.el.style.top = obj.y + 'px';
                        if (obj.y > containerHeight) {
                            obj.el.remove(); this.activeHexes.splice(i, 1);
                            this.score += 2; this.scoreDisplay.innerText = this.score;
                        }
                    } else {
                        obj.y += this.speed; obj.el.style.top = obj.y + 'px';
                        if (obj.y + HEX_HEIGHT > dangerLimit) { triggerGameOver(this); return; }
                    }
                }
                
                this.topMostY += this.speed;
                if (this.topMostY > -ROW_HEIGHT) this.generateRow(this.topMostY - ROW_HEIGHT);
            }

            spawnParticles(x, y) {
                for (let i = 0; i < 5; i++) {
                    let p = document.createElement('div'); p.classList.add('particle');
                    p.style.left = `${x}px`; p.style.top = `${y}px`; this.container.appendChild(p);
                    let angle = Math.random() * Math.PI * 2; let dist = Math.random() * 40 + 20;
                    setTimeout(() => { p.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px) scale(0) rotate(${Math.random()*360}deg)`; p.style.opacity = '0'; }, 10);
                    setTimeout(() => p.remove(), 600);
                }
            }

            spawnFloatingText(x, y, text, color) {
                let txt = document.createElement('div'); txt.classList.add('floating-text');
                txt.innerText = text; txt.style.color = color; txt.style.left = `${x}px`; txt.style.top = `${y}px`;
                this.container.appendChild(txt); setTimeout(() => txt.remove(), 1000);
            }
        }

        function gameLoop() {
            if (globalGameOver) return;
            players.forEach(p => p.update());
            mainLoopId = requestAnimationFrame(gameLoop);
        }

        function triggerGameOver(loser) {
            globalGameOver = true;
            cancelAnimationFrame(mainLoopId);
            stopBGM();
            playGameOverSound();
            fireConfetti(); // 觸發全螢幕勝利撒花
            
            const winnerDisplay = document.getElementById('winner-display');
            if (config.players === 1) {
                winnerDisplay.innerText = `挑戰結束！\n得分: ${players[0].score}`;
            } else {
                let winner = players.filter(p => p !== loser)[0];
                winnerDisplay.innerText = `🏆 ${winner.theme.name} 獲勝 🏆`;
            }

            document.getElementById('game-over-screen').classList.remove('hidden');
        }

        // --- 撒花特效 (Confetti) ---
        function fireConfetti() {
            const colors = ['#FF9800', '#E91E63', '#4CAF50', '#00BCD4', '#FFEB3B'];
            for(let i = 0; i < 150; i++) {
                let conf = document.createElement('div');
                conf.classList.add('confetti');
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                let duration = Math.random() * 3 + 2;
                let delay = Math.random() * 2;
                conf.style.animationDuration = `${duration}s`;
                conf.style.animationDelay = `${delay}s`;
                
                document.body.appendChild(conf);
                setTimeout(() => conf.remove(), (duration + delay) * 1000);
            }
        }
    </script>
</body>
</html>
